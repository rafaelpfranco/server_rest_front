name: Frontend Tests - ServeRest Front

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - run-front-tests

jobs:
  frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-latest
    container:
      image: cypress/included:13.17.0

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Cypress frontend tests
        run: npm run cy:run -- --record

      - name: Upload Cypress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-front
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-front
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-front
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload Cypress downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-downloads-front
          path: cypress/downloads
          if-no-files-found: ignore
